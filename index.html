<!DOCTYPE html> <html lang="vi"> <head> <meta charset="UTF-8"> <title>Farewell Party Invitation</title> <style> body{ margin:0; font-family:Arial, Helvetica, sans-serif; background:linear-gradient(135deg,#ff758c,#ff7eb3); height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden; color:white; text-align:center; } /* intro screen */ #intro h1{ font-size:38px; margin-bottom:40px; text-shadow:0 5px 15px rgba(0,0,0,0.3); } button{ padding:16px 35px; font-size:20px; border:none; border-radius:12px; background:white; color:#ff4d6d; cursor:pointer; font-weight:bold; transition:0.3s; } button:hover{ transform:scale(1.1); } /* card */ #card{ display:none; background:white; color:#333; padding:40px; width:420px; border-radius:18px; box-shadow:0 15px 35px rgba(0,0,0,0.3); animation:pop 0.8s ease; } @keyframes pop{ from{ transform:scale(0.4); opacity:0; } to{ transform:scale(1); opacity:1; } } h2{ color:#ff4d6d; } .info{ margin:15px 0; font-size:18px; } a{ color:#0077ff; font-weight:bold; text-decoration:none; } /* countdown */ #countdown{ font-size:20px; margin-top:15px; color:#ff4d6d; font-weight:bold; } /* confetti */ .confetti{ position:fixed; width:10px; height:10px; top:-10px; animation:fall linear infinite; } @keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); } } </style> </head> <body> <div id="intro"> <h1> 🎉 Thiệp mời tham dự<br> Farewell Huy Võ<br> & Welcome Hoàng Phạm </h1> <button onclick="openInvite()"> Mở Thiệp </button> </div> <div id="card"> <h2>🎉 Farewell & Welcome Party 🎉</h2> <p class="info"> ⏰ <b>Thời gian</b><br> 16h00 - 27/03/2026 </p> <p class="info"> 📍 <b>Địa điểm</b><br> <a href="https://www.google.com/maps/place/N%C3%93C+Beer/@10.7890715,106.640061,1068m/data=!3m2!1e3!4b1!4m6!3m5!1s0x31752fd1b23869f7:0x442474a74cb2858d!8m2!3d10.7890662!4d106.6426359!16s%2Fg%2F11mttwxhcc?entry=ttu" target="_blank"> 🍻 Nóc Beer (Google Maps) </a> </p> <div id="countdown"></div> <p> Rất mong bạn đến chung vui cùng chúng tôi 🎉 </p> </div> <audio id="music" loop> <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"> </audio> <script> function openInvite(){ document.getElementById("intro").style.display="none"; document.getElementById("card").style.display="block"; document.getElementById("music").play(); /* confetti */ for(let i=0;i<80;i++){ let confetti=document.createElement("div"); confetti.className="confetti"; confetti.style.left=Math.random()*100+"vw"; confetti.style.animationDuration=(3+Math.random()*5)+"s"; confetti.style.backgroundColor= ["#ff4d6d","#ffd166","#06d6a0","#118ab2","#ef476f"][Math.floor(Math.random()*5)]; document.body.appendChild(confetti); } } /* countdown */ const partyDate=new Date("March 27, 2026 16:00:00").getTime(); const timer=setInterval(function(){ const now=new Date().getTime(); const distance=partyDate-now; const days=Math.floor(distance/(1000*60*60*24)); const hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60)); const minutes=Math.floor((distance%(1000*60*60))/(1000*60)); document.getElementById("countdown").innerHTML= "⏳ Countdown: "+days+" ngày "+hours+" giờ "+minutes+" phút"; },1000); </script> </body> </html>
