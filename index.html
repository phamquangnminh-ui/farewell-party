<!DOCTYPE html> <html lang="vi"> <head> <meta charset="UTF-8"> <title>Farewell and Welcome Party</title> <style> body{ margin:0; font-family:Arial, Helvetica, sans-serif; text-align:center; background:linear-gradient(135deg,#ff9a9e,#fad0c4); overflow:hidden; } .confetti{ position:fixed; width:10px; height:10px; top:-10px; animation:fall linear infinite; } @keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); } } .card{ margin-top:120px; background:white; padding:40px; width:420px; border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,0.2); margin-left:auto; margin-right:auto; animation:pop 1s ease; } @keyframes pop{ from{ transform:scale(0.5); opacity:0; } to{ transform:scale(1); opacity:1; } } h1{ color:#ff4d6d; } .info{ font-size:18px; margin:15px 0; } button{ margin-top:15px; padding:12px 25px; font-size:18px; border:none; border-radius:8px; background:#ff4d6d; color:white; cursor:pointer; transition:0.3s; } button:hover{ transform:scale(1.1); background:#ff1f4b; } a{ color:#0077ff; text-decoration:none; font-weight:bold; } </style> </head> <body> <div class="card"> <h1>🎉 Farewell and Welcome Party 🎉</h1> <p class="info"> ⏰ <b>Thời gian:</b><br> 16h00, Ngày 27/03/2026 </p> <p class="info"> 📍 <b>Địa điểm:</b><br> <a href="https://www.google.com/maps/place/N%C3%93C+Beer/@10.7890715,106.640061,1068m/data=!3m2!1e3!4b1!4m6!3m5!1s0x31752fd1b23869f7:0x442474a74cb2858d!8m2!3d10.7890662!4d106.6426359!16s%2Fg%2F11mttwxhcc?entry=ttu&g_ep=EgoyMDI2MDMwOC4wIKXMDSoASAFQAw%3D%3D" target="_blank"> 🍻 Nóc Beer (Xem Google Maps) </a> </p> <p>Chúng ta hãy cùng nhau ăn mừng và tạo nên những kỷ niệm tuyệt vời!</p> <button onclick="alert('Hẹn gặp bạn tại bữa tiệc! 🎉')"> 🎊 Xác nhận tham dự </button> </div> <script> for(let i=0;i<60;i++){ let confetti=document.createElement("div"); confetti.className="confetti"; confetti.style.left=Math.random()*100+"vw"; confetti.style.animationDuration=(3+Math.random()*5)+"s"; confetti.style.backgroundColor= ["#ff4d6d","#ffd166","#06d6a0","#118ab2","#ef476f"][Math.floor(Math.random()*5)]; document.body.appendChild(confetti); } </script> </body> </html>
